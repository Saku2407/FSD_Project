{% extends "register_inout/base.html" %}

{% block title %}Feedback{% endblock %}

{% block content %}

<h2>Feedback</h2>

<hr>

{% if submitted %}

<div class="success">Thank you. Your feedback has been saved.</div>

{% endif %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="button" type="submit">Submit Feedback</button>

</form>

{% endblock %}

{% extends "lab/base.html" %}
{% block title %}Feedback{% endblock %}
{% block content %}
<h1 class="page-title">Feedback</h1>
<div class="text">
  {% if submitted %}
    <p class="thanks">Thank you! Your feedback has been received.</p>
  {% else %}
    <p>We would love to hear what you think about this lab.</p>
    <form method="post" class="fb-form">
      {% csrf_token %}
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="msg">Your feedback</label>
      <textarea id="msg" name="message" rows="6" required></textarea>

      <button type="submit">Submit</button>
    </form>
  {% endif %}
</div>
{% endblock %}
